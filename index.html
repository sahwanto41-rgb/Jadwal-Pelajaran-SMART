const AUTH_SALT='lanas1-smart',SESS_KEY='lss_sess';
const USERS=[{u:'admin',s:'3daad2a61d9c812391a02e35ede9c81d53976a565952499185aa242a32b03dc8',f:'2a39f76ddb2b034f'}];

function hasSubtle(){return !!(window.crypto&&crypto.subtle&&window.TextEncoder)}
async function hashPw(u,p){const t=AUTH_SALT+'|'+u.toLowerCase()+'|'+p;
 if(hasSubtle()){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return['s',Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')]}
 let a=5381,b=52711;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);a=((a<<5)+a^c)>>>0;b=((b<<5)+b^c*31)>>>0}return['f',a.toString(16)+b.toString(16)]}

async function doLogin(e){e.preventDefault();const f=e.target.elements,u=f.u.value.trim(),p=f.p.value;
 try{
  if(Date.now()<lockUntil)authMsg='Terlalu banyak percobaan. Coba lagi dalam '+Math.ceil((lockUntil-Date.now())/1000)+' detik.';
  else{const [m,h]=await hashPw(u,p),acc=USERS.find(x=>x.u.toLowerCase()===u.toLowerCase());
