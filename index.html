<div class="card"><h2>Catatan penting</h2><p>Target JP <b>tidak diisi otomatis</b>: isi sendiri dari struktur kurikulum yang telah diverifikasi (Permendikdasmen 13/2025 beserta lampirannya) dan KSP sekolah, lalu centang verifikasi di menu Data. Tombol "Muat JP contoh" hanya untuk uji coba. Jam belajar, jumlah JP per hari, dan istirahat bawaan hanyalah nilai awal yang dapat diubah; sesuaikan dengan ketentuan sekolah. Kokurikuler diampu guru kelas dan ditempatkan di akhir hari belajar. PAIPB dan PJOK dijadwalkan sebagai 1 blok JP berurutan dan tidak melewati istirahat; PJOK selalu ditempatkan pada JP 1–3 (dapat diubah di kolom "Hanya di JP 1–N") dengan urutan hari per kelas (bawaan: Kelas I Sabtu, II Jumat, III Kamis, IV Rabu, V Selasa, VI Senin; bisa dibalik di menu Data). Matematika dan IPAS (mapel yang menuntut konsentrasi dan penalaran) juga ditempatkan pada JP 1–3; mapel lain, mis. Bahasa Indonesia atau PP, dapat ditambahkan dengan mengisi kolom "Hanya di JP 1–N" = 3. PAIPB bebas ditempatkan di JP berapa pun, tetapi hanya satu kelas per hari dan tersebar tanpa celah hari (6 kelas = Senin–Sabtu masing-masing satu kelas) (kolom "Hanya di JP 1–N" = 0). Kelas I dibatasi maksimal sampai JP 6 dan Kelas II sampai JP 7. Setiap kelas dibatasi maksimal 5 mata pelajaran berbeda per hari (dapat diubah di menu Data). Kokurikuler dipecah per 2 JP (6 JP = 2+2+2; jumlah ganjil, mis. 7 JP = 3+2+2). Literasi pagi 15 menit mendahului JP 1 setiap hari dan tidak dihitung sebagai JP. Mapel utama (PP, BIND, MTK, dst.) tidak dipecah-pecah: tiap mapel disusun dalam jumlah sesi paling sedikit (maks. sesuai JP berurutan tanpa istirahat, mis. 4 JP = 2+2, 7 JP = 3+2+2), tiap sesi berurutan dalam satu hari. Hanya Kokurikuler yang boleh dipecah. Setiap guru dijadwalkan mengajar di semua hari belajar (sebanyak jumlah sesi yang dimilikinya). Jam belajar Jumat dan Sabtu sampai JP 5. Seluruh hari Senin–Sabtu diisi penuh tanpa celah. Bila total JP suatu kelas lebih sedikit dari slot yang tersedia, kekurangannya dikosongkan di JP terakhir hari Kamis, Rabu, Selasa, lalu Senin (satu JP per hari) dan dicatat setelah Generate. Seluruh guru dianggap tersedia setiap hari. Validasi ruang/sarana belum aktif karena data ruang belum diisi.</p></div>`}
if(tab=='data'){const up=(k,l,w,hint)=>`<div class="up"><b>${l}</b>${S.kop[k]?`<img class="thumb" src="${S.kop[k]}" alt="${l}">`:'<small>Belum ada</small>'}<input type="file" accept="image/png,image/jpeg,image/webp" onchange="imgUp('${k}',${w},event)" aria-label="Unggah ${l}">${S.kop[k]?`<button class="b s" onclick="act('clearImg','${k}')">Hapus</button>`:''}<small>${hint}</small></div>`;
h+=`<div class="card"><h2>Jam belajar</h2><div class="row"><label>Mulai (literasi pagi) <input type="time" value="${S.start}" onchange="act('setCfg','start',this.value)"></label><label>Menit/JP <input type="number" value="${S.jpMin}" onchange="act('setCfg','jpMin',this.value)"></label><label><input type="checkbox" ${S.litOn?'checked':''} onchange="act('setCfg','litOn',this.checked)"> Literasi pagi</label><label>Menit <input type="number" value="${S.litMin}" onchange="act('setCfg','litMin',this.value)"></label><label>Maks JP berurutan per sesi mapel <input type="number" min="1" max="6" value="${S.maxRun}" onchange="act('setCfg','maxRun',this.value)"></label><label>Maks mapel berbeda/hari tiap kelas (0 = bebas) <input type="number" min="0" max="12" value="${S.maxSubj}" onchange="act('setCfg','maxSubj',this.value)"></label>${[['brk1','Istirahat 1 setelah JP ke-'],['brk1Min','Menit'],['brk2','Istirahat 2 setelah JP ke-'],['brk2Min','Menit']].map(([k,l])=>`<label>${l} <input type="number" value="${S[k]}" onchange="act('setCfg','${k}',this.value)"></label>`).join('')}</div>
<div class="sc"><table><tr><th>Hari</th>${DAYS.map(d=>`<th>${d}</th>`).join('')}</tr><tr><th>Jumlah JP/hari</th>${DAYS.map((_,d)=>`<td><input type="number" value="${S.slots[d]}" onchange="act('setSlot',${d},this.value)"></td>`).join('')}</tr></table></div><div class="row" style="margin-top:8px"><label>Hari PJOK per kelas ${sel([['desc','Kelas I Sabtu → Kelas VI Senin'],['asc','Kelas I Senin → Kelas VI Sabtu'],['free','Bebas (acak)']],S.pjokMode,"act('setPjok',this.value)")}</label></div><div class="row" style="margin-top:6px"><b>Maks JP per hari tiap kelas (0 = ikuti JP hari):</b>${S.classes.map((c,i)=>`<label>Kelas ${c} <input type="number" min="0" max="12" value="${S.cmax[i]||0}" onchange="act('setCmax',${i},this.value)" aria-label="Maksimal JP kelas ${c}"></label>`).join('')}</div><small>Nilai awal ini bukan ketentuan resmi; sesuaikan dengan ketentuan sekolah.</small></div>
<div class="card"><h2>Daftar nama guru</h2><div class="f">${S.teachers.map((t,i)=>`<input value="${esc(t.n)}" onchange="act('setTeach',${i},this.value)" aria-label="Nama guru ${i+1}">`).join('')}</div><button class="b" style="margin-top:8px" onclick="act('addT')">+ Guru</button></div>
<div class="card"><h2>KOP sekolah &amp; pengesahan (tampil di semua dokumen cetak)</h2>
<div class="row" style="align-items:flex-start;gap:20px">${up('img','Gambar KOP sekolah',1600,'Gambar KOP selebar halaman (PNG/JPG, disarankan lebar ≥ 1200 px). Bila ada, menggantikan KOP teks.')}${up('logo','Logo (untuk KOP teks)',300,'Dipakai bila tidak ada gambar KOP.')}${up('ttd','Tanda tangan Kepala Sekolah',600,'PNG latar transparan paling baik.')}${up('stp','Stempel sekolah',500,'PNG latar transparan paling baik.')}</div>
<div class="f" style="margin-top:12px">${[['i1','Baris 1 KOP teks'],['i2','Baris 2 KOP teks (boleh kosong)'],['sk','Nama sekolah'],['al','Alamat / kontak'],['kota','Tempat pengesahan'],['jab','Jabatan penandatangan'],['kepsek','Nama Kepala Sekolah'],['nip','NIP']].map(([k,l])=>`<label>${l}<input value="${esc(S.kop[k])}" onchange="act('setKop','${k}',this.value)"></label>`).join('')}<label>Tanggal pengesahan<input type="date" value="${S.kop.tgl}" onchange="act('setKop','tgl',this.value)"></label></div>
<label class="row" style="margin-top:8px"><input type="checkbox" ${S.kop.showSign?'checked':''} onchange="act('setKop','showSign',this.checked)"> Tampilkan blok pengesahan (tempat, tanggal, tanda tangan, stempel)</label><small>Tanggal dikosongkan = memakai tanggal hari ini. Gambar disimpan di peramban perangkat ini.</small>
<div style="margin-top:10px"><b>Pratinjau:</b><div class="card" style="background:#fff;color:#000">${kop()}${sign()}</div></div></div>
<div class="card"><h2>Mata pelajaran, JP/pekan & guru pengampu</h2><div class="row">${S.classes.map((c,i)=>`<button class="b ${selC==i?'p':''}" onclick="selC=${i};render()">Kelas ${c}</button>`).join('')}</div><div class="sc"><table><tr><th>Kode</th><th>Mapel (JP 0 = tidak diterapkan)</th><th>JP</th><th>Guru pengampu</th><th>Jam 1 blok (tidak dipecah)</th><th>Hanya di JP 1–N (0 = bebas)</th></tr>${S.subjects.map((s,i)=>`<tr><td><input style="width:80px" value="${esc(S.codes[i])}" onchange="act('setCode',${i},this.value)"></td><td><input value="${esc(s)}" onchange="act('setSub',${i},this.value)"></td><td><input type="number" value="${S.jp[selC+'_'+i]||0}" onchange="act('setJP',${selC},${i},this.value)"></td><td>${sel([['','— pilih —'],...S.teachers.map((t,j)=>[j,t.n])],S.asg[selC+'_'+i]??'',`act('setAsg',${selC},${i},this.value)`)}</td><td><input type="checkbox" ${S.blk[i]?'checked':''} onchange="act('setBlk',${i},this.checked)"></td><td><input type="number" min="0" max="12" value="${S.win[i]||0}" onchange="act('setWin',${i},this.value)" aria-label="Batas JP ${esc(S.codes[i])}"></td></tr>`).join('')}</table></div><div class="row" style="margin-top:8px"><button class="b" onclick="act('addS')">+ Mapel</button><button class="b" onclick="loadDemo()">Muat JP contoh (uji coba)</button><button class="b" onclick="clearJP()">Kosongkan JP</button><label><input type="checkbox" ${S.verified?'checked':''} ${S.demo?'disabled':''} onchange="act('setVer',this.checked)"> Target JP sudah saya verifikasi terhadap struktur kurikulum &amp; KSP</label></div></div>`}
if(tab=='kelas'){if(!S.sched)h+='<div class="card">Belum ada jadwal. Klik Generate di Dashboard.</div>';else{h+=`<div class="card np"><div class="row"><b>Status:</b>${stTag}<button class="b" onclick="editMode=!editMode;render()">${editMode?'Matikan ubah manual':'Aktifkan ubah manual'}</button></div><small>Jadwal ditampilkan tanpa pilihan dropdown. Ubah manual hanya aktif bila tombol dinyalakan (kembali mati saat halaman dimuat ulang); setiap ubahan tetap diperiksa konflik.</small></div>`+printBar(true);
if(S.pr.mode=='all')h+=`<div class="docs">${allDoc(R)}</div>`;
else h+='<div class="docs">'+S.classes.map((c,i)=>{const ids=S.subjects.map((_,s)=>s).filter(s=>S.jp[i+'_'+s]>0);return`<div class="card doc" style="${fit('per',ids.length,i)}">${kop()}<div class="dt"><span class="bn">JADWAL PELAJARAN KELAS ${c}</span><span class="ta">TAHUN PELAJARAN ${TA}</span></div>${schedTable(i,R,editMode)}${leg(ids)}${sign()}${ft()}</div>`}).join('')+'</div>'}}
if(tab=='guru'){if(!S.sched)h+='<div class="card">Belum ada jadwal.</div>';else{h+=printBar(false)+'<div class="docs">';S.teachers.forEach((t,ti)=>{const ids=new Set(),body=grid((d,p)=>{const x=[];let fs=-1;S.classes.forEach((cn,c)=>{const s=S.sched[c][d][p];if(s>=0&&S.asg[c+'_'+s]==ti){x.push(`${cd(s)} (${cn})`);ids.add(s);if(fs<0)fs=s}});return`<td class="cd ${fs>=0?'cl':''}" ${fs>=0?`style="${sty(fs)}"`:''}>${esc(x.join(' / '))}</td>`},Math.max(...S.slots));h+=`<div class="card doc" style="${fit('per',ids.size,106)}">${kop()}<div class="dt"><span class="bn">JADWAL MENGAJAR</span><span class="ta">TAHUN PELAJARAN ${TA}</span></div><h2>${esc(t.n)}</h2>${body}${leg([...ids].sort((a,b)=>a-b))}${sign()}${ft()}</div>`});h+='</div>'}}
if(tab=='cek'){h+=`<div class="card"><h2>Pemeriksaan konflik & JP</h2>${stTag}`+(S.sched?(R.err.length?`<ul>${R.err.map(e=>`<li class="er">${esc(e)}</li>`).join('')}</ul>`:'<p class="ok">Tidak ada bentrok guru/kelas, JP sesuai target, PAIPB/PJOK tidak terpecah, PJOK berada di JP 1–3 (sesuai batas JP), JP satu mapel pada satu hari berurutan, mapel utama tidak dipecah-pecah, setiap guru mengajar di semua hari belajar (sesuai jumlah sesinya), hari PJOK dan batas JP kelas dipenuhi, kokurikuler berada di akhir hari, dan jumlah mapel per hari tidak melebihi batas.</p>'):'<p>Belum ada jadwal.</p>')+`</div>
<div class="card"><h2>Analisis beban mengajar</h2><div class="sc"><table><tr><th>Guru</th><th>JP target</th><th>JP terjadwal</th><th>Selisih</th><th>Hari</th><th>Jam kosong</th><th>Status</th></tr>${S.teachers.map((t,i)=>{const x=R.tl[i],df=x.act-x.tgt,ok=S.sched&&df==0;if(!x.tgt)return`<tr><td>${esc(t.n)}</td><td>0</td><td>-</td><td>-</td><td>0</td><td>0</td><td class="wn">Belum ada JP mengajar</td></tr>`;return`<tr><td>${esc(t.n)}</td><td>${x.tgt}</td><td>${S.sched?x.act:'-'}</td><td>${S.sched?df:'-'}</td><td>${x.days}</td><td>${x.gap}</td><td class="${!S.sched?'':ok?(x.gap?'wn':'ok'):'er'}">${!S.sched?'-':ok?(x.gap?'Peringatan':'Valid'):'Tidak valid'}</td></tr>`}).join('')}</table></div><small>Kesesuaian beban kerja guru menurut regulasi harus dinilai terpisah berdasarkan SK pembagian tugas resmi.</small></div>
<div class="card"><h2>Riwayat perubahan</h2><ul>${S.log.slice().reverse().slice(0,30).map(l=>`<li>${esc(l)}</li>`).join('')||'<li>Belum ada.</li>'}</ul></div>`}
if(tab=='exp')h+=`<div class="card"><h2>Ekspor & cadangan</h2><div class="row"><button class="b p" onclick="csv()">Unduh CSV jadwal (bisa dibuka di Excel)</button><button class="b" onclick="printTab('kelas','per')">Cetak Jadwal Kelas (1 halaman/kelas)</button><button class="b" onclick="printTab('kelas','all')">Cetak Semua Kelas (1 lembar)</button><button class="b" onclick="printTab('guru')">Cetak Jadwal Guru</button><button class="b g" onclick="bak()">Cadangkan data (JSON)</button><label class="b">Pulihkan JSON <input type="file" accept=".json" hidden onchange="imp(event)"></label><button class="b" onclick="reset()">Reset data</button></div><p>Data tersimpan di browser perangkat ini. Unduh cadangan secara berkala. Impor JSON diperiksa dulu; berkas rusak ditolak tanpa mengubah data.</p></div>`;
$('#app').innerHTML=h}
function render(){try{draw()}catch(e){console.error(e);$('#app').innerHTML=`<div class="card"><h2>Terjadi kesalahan saat menampilkan data</h2><p class="er">${esc(e.message)}</p><p>Data tidak dihapus. Unduh salinannya, atau atur ulang ke data awal.</p><div class="row"><button class="b" onclick="bak()">Unduh salinan data (JSON)</button><button class="b d" onclick="reset()">Atur ulang ke data awal</button></div></div>`}}
load();render();
</script></body></html>
